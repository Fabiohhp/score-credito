[project]
name = "credit-scoring-xai"
version = "0.1.0"
description = "Credit scoring com otimização de cutoff e interpretabilidade (Give Me Some Credit)"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "joblib>=1.6.0",
    "jupyterlab>=4.6.4",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_scoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # avisos de mudança de API em bibliotecas de terceiros, sem efeito nos resultados
    "ignore::UserWarning:shap.*",
    "ignore::PendingDeprecationWarning",
    "ignore:IProgress not found",
]
